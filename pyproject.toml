[project]
name = "industrial-speech-intelligence"
version = "0.1.0"
description = "AI-powered speech intelligence for industrial maintenance"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "av==17.1.0",
    "fastembed>=0.9.1",
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "piper-tts>=1.8.0",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
